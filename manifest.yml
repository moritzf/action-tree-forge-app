modules:
  jira:issueContext:
    - key: action-tree-context
      title: Action Tree
      label: Launch Action Tree
      resource: main
      render: native
      resolver:
        function: resolver
      displayConditions:
        issueType: Task
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
app:
  id: ari:cloud:ecosystem::app/e33feedf-6b09-4d8a-8f64-f32f69d1b443
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
